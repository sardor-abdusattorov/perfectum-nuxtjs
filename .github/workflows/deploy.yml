name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - name: Install PHP deps
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: api
        run: php artisan test --compact

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build-frontend]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd ${{ secrets.SERVER_APP_PATH }}

            git fetch origin main
            git reset --hard origin/main

            cd api

            composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader

            npm ci --no-audit --no-fund
            npm run build

            php artisan migrate --force
            php artisan storage:link || true
            php artisan filament:assets
            php artisan project:update

            cd ../frontend

            pnpm install --frozen-lockfile
            pnpm build

            RESTART='${{ secrets.SERVER_FRONTEND_RESTART }}'
            RESTART="${RESTART:-sudo systemctl restart perfectum-new-nuxt}"

            if ! eval "$RESTART"; then
              echo "Не удалось перезапустить фронтенд: «$RESTART»."
              exit 1
            fi

            echo "Deploy complete"

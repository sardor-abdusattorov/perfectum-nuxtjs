x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: perfectum-php
  volumes:
    - ./api:/var/www/api
    - vendor:/var/www/api/vendor
  env_file:
    - path: api/.env
      required: false
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: perfectum-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/api/public:ro
      - ./api/storage/app/public:/var/www/api/public/storage:ro
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    <<: *php
    container_name: perfectum-php
    command: >
      sh -c "[ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
             exec php-fpm"

  queue:
    <<: *php
    container_name: perfectum-queue
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
             exec php artisan queue:work --tries=3 --sleep=3 --max-time=3600"
    depends_on:
      - php

  scheduler:
    <<: *php
    container_name: perfectum-scheduler
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
             exec php artisan schedule:work"
    depends_on:
      - php

  node:
    image: node:24-alpine
    container_name: perfectum-node
    working_dir: /app
    command: >
      sh -c "command -v pnpm >/dev/null || npm i -g pnpm@10;
             [ -d node_modules/nuxt ] || pnpm install;
             exec pnpm dev --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    env_file:
      - path: frontend/.env
        required: false
    environment:
      NUXT_API_BASE: http://nginx/api/v1
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  node_modules:
  vendor:
